<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Who does what, and what they cannot do</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --step-fill: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #8e98ac;
      --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --lane-strong: rgba(245,245,245,0.22); --lane-hair: rgba(245,245,245,0.10);
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .lane-strong { stroke: var(--lane-strong); stroke-width: 1; }
    .lane-hair { stroke: var(--lane-hair); stroke-width: 1; }
    .lane-label { fill: var(--muted); font: 400 9px var(--mono); letter-spacing: 0.18em; }
    .flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .flow.accent { stroke: var(--accent); stroke-width: 1.4; }
    .flow.back { stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .step { fill: var(--step-fill); stroke: var(--ink); stroke-width: 1; }
    .step.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .step-name { fill: var(--ink); font: 600 11px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .step-sub { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.12em; text-anchor: middle; }
    .arrow-label.accent { fill: var(--accent); }
    .mask { fill: var(--paper); }
    .legend-text { fill: var(--muted); font: 400 8.5px var(--sans); }
    .legend-eyebrow { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.18em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Swimlane · Mission Harness</p>
    <h1>Who does what, and what they cannot do</h1>

    <svg viewBox="0 0 1360 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seats-dark-title seats-dark-desc">
      <title id="seats-dark-title">Who does what, and what they cannot do</title>
      <desc id="seats-dark-desc">A swimlane across five actors. The orchestrator writes the validation contract; a human approves it before any code exists; the orchestrator then routes one feature to a worker, which builds inside a single area's paths. The worker hands off to a validator running in a fresh context that never saw the implementation, and the validator's verdicts feed a deterministic rule engine that returns advance, corrective or stop. A corrective decision routes back to the orchestrator for another round.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8e98ac"/></marker>
      </defs>
      <rect width="1360" height="580" fill="#2d3142"/>
      <rect width="1360" height="580" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane dividers -->
      <line class="lane-strong" x1="40" y1="80" x2="1320" y2="80"/>
      <line class="lane-hair" x1="40" y1="160" x2="1320" y2="160"/>
      <line class="lane-hair" x1="40" y1="240" x2="1320" y2="240"/>
      <line class="lane-hair" x1="40" y1="320" x2="1320" y2="320"/>
      <line class="lane-hair" x1="40" y1="400" x2="1320" y2="400"/>
      <line class="lane-strong" x1="40" y1="480" x2="1320" y2="480"/>
      <line class="lane-strong" x1="168" y1="80" x2="168" y2="480"/>

      <!-- Lane labels -->
      <text class="lane-label" x="56" y="124">HUMAN</text>
      <text class="lane-label" x="56" y="204">ORCHESTRATOR</text>
      <text class="lane-label" x="56" y="284">WORKER</text>
      <text class="lane-label" x="56" y="364">VALIDATOR</text>
      <text class="lane-label" x="56" y="444">RULE ENGINE</text>

      <!-- Flow (drawn before boxes) -->
      <!-- 1. Write contract -> Approve : destination above, enter its bottom port -->
      <path class="flow" d="M328,196 H428 Q436,196 436,188 V144" marker-end="url(#arrow)"/>
      <!-- 2. Approve -> Route feature : destination below, enter its top port -->
      <path class="flow" d="M496,116 H604 Q612,116 612,124 V168" marker-end="url(#arrow)"/>
      <!-- 3. Route feature -> Build -->
      <path class="flow" d="M680,196 H796 Q804,196 804,204 V248" marker-end="url(#arrow)"/>
      <!-- 4. Build -> Adjudicate : THE creator/verifier boundary, the one coral edge -->
      <path class="flow accent" d="M880,276 H988 Q996,276 996,284 V328" marker-end="url(#arrow-accent)"/>
      <!-- 5. Adjudicate -> Decide : same x, straight vertical -->
      <path class="flow" d="M996,380 V408" marker-end="url(#arrow)"/>
      <!-- 6. Decide -> Advance : exits the right edge, rises into the orchestrator lane -->
      <path class="flow" d="M1064,436 H1220 Q1228,436 1228,428 V224" marker-end="url(#arrow)"/>
      <!-- 7. Decide -> Route feature : the corrective round, exits the left edge -->
      <path class="flow back" d="M928,436 H620 Q612,436 612,428 V224" marker-end="url(#arrow-soft)"/>

      <!-- Arrow labels: masked, clear of both the stroke and every later-drawn node -->
      <rect class="mask" x="1004" y="298" width="76" height="12" rx="2"/>
      <text class="arrow-label accent" x="1042" y="308">FRESH CONTEXT</text>

      <rect class="mask" x="744" y="416" width="60" height="12" rx="2"/>
      <text class="arrow-label" x="774" y="426">CORRECTIVE</text>

      <rect class="mask" x="1116" y="416" width="52" height="12" rx="2"/>
      <text class="arrow-label" x="1142" y="426">ADVANCE</text>

      <!-- Steps -->
      <rect class="step" x="192" y="172" width="136" height="48" rx="6"/>
      <text class="step-name" x="260" y="194">Write contract</text>
      <text class="step-sub" x="260" y="208">before any code</text>

      <rect class="step focal" x="376" y="92" width="120" height="48" rx="6"/>
      <text class="step-name focal-name" x="436" y="114">Approve</text>
      <text class="step-sub" x="436" y="128">or revise</text>

      <rect class="step" x="544" y="172" width="136" height="48" rx="6"/>
      <text class="step-name" x="612" y="194">Route feature</text>
      <text class="step-sub" x="612" y="208">one area, one seat</text>

      <rect class="step" x="728" y="252" width="152" height="48" rx="6"/>
      <text class="step-name" x="804" y="274">Build in one area</text>
      <text class="step-sub" x="804" y="288">cannot edit outside</text>

      <rect class="step" x="928" y="332" width="136" height="48" rx="6"/>
      <text class="step-name" x="996" y="354">Adjudicate</text>
      <text class="step-sub" x="996" y="368">read-only</text>

      <rect class="step" x="928" y="412" width="136" height="48" rx="6"/>
      <text class="step-name" x="996" y="434">Decide</text>
      <text class="step-sub" x="996" y="448">tested, not judged</text>

      <rect class="step" x="1160" y="172" width="136" height="48" rx="6"/>
      <text class="step-name" x="1228" y="194">Advance</text>
      <text class="step-sub" x="1228" y="208">next milestone</text>

      <!-- Legend -->
      <line class="lane-hair" x1="40" y1="500" x2="1320" y2="500" stroke-width="0.8"/>
      <text class="legend-eyebrow" x="40" y="516">LEGEND</text>

      <rect class="step" x="40" y="532" width="14" height="10" rx="2"/>
      <text class="legend-text" x="60" y="541">Step</text>

      <rect class="step focal" x="128" y="532" width="14" height="10" rx="2"/>
      <text class="legend-text" x="148" y="541">Human gate, before any code</text>

      <line class="flow accent" x1="332" y1="537" x2="360" y2="537" marker-end="url(#arrow-accent)"/>
      <text class="legend-text" x="368" y="541">Creator hands off to a verifier that never saw the code</text>

      <line class="flow back" x1="712" y1="537" x2="740" y2="537" marker-end="url(#arrow-soft)"/>
      <text class="legend-text" x="748" y="541">Corrective round, capped at two</text>
    </svg>
  </main>
</body>
</html>
