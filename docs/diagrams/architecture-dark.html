<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Why the same harness runs anywhere</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --step-fill: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #8e98ac;
      --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --input-fill: rgba(191,192,192,0.10);
      --store-fill: rgba(245,245,245,0.05);
      --external-fill: rgba(245,245,245,0.03); --external-stroke: rgba(245,245,245,0.30);
      --zone-fill: rgba(245,245,245,0.02); --zone-stroke: rgba(245,245,245,0.10);
      --zone-label: rgba(245,245,245,0.40);
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 0.8; }
    .zone-label { fill: var(--zone-label); font: 400 7px var(--mono); letter-spacing: 0.14em; text-anchor: middle; }
    .flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .node { fill: var(--step-fill); stroke: var(--ink); stroke-width: 1; }
    .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .node.input { fill: var(--input-fill); stroke: var(--soft); }
    .node.store { fill: var(--store-fill); stroke: var(--muted); }
    .node.external { fill: var(--external-fill); stroke: var(--external-stroke); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.12em; text-anchor: middle; }
    .mask { fill: var(--paper); }
    .legend-text { fill: var(--muted); font: 400 8.5px var(--sans); }
    .legend-eyebrow { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.18em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Mission Harness</p>
    <h1>Why the same harness runs anywhere</h1>

    <svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">Why the same harness runs anywhere</title>
      <desc id="architecture-dark-desc">A repository is surveyed once into a single config file, which is the only place project knowledge lives. That config feeds two separated halves: runtime-agnostic seat prompts that carry judgement, and a pure tested rule engine plus CLI that carry the decisions. Any agent runtime loads the prompts and writes mission artifacts; the CLI reads those artifacts to evaluate the rules. Swapping the runtime or the repository leaves everything else unchanged.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1120" height="640" fill="#2d3142"/>
      <rect width="1120" height="640" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect class="zone" x="544" y="96" width="216" height="96" rx="8"/>
      <rect class="mask" x="626" y="100" width="52" height="12" rx="2"/>
      <text class="zone-label" x="652" y="109">JUDGEMENT</text>

      <rect class="zone" x="544" y="344" width="216" height="176" rx="8"/>
      <rect class="mask" x="620" y="348" width="64" height="12" rx="2"/>
      <text class="zone-label" x="652" y="357">DETERMINISM</text>

      <!-- Flow -->
      <!-- Your repo -> config : one-time survey -->
      <line class="flow" x1="208" y1="276" x2="284" y2="276" marker-end="url(#arrow)"/>
      <!-- config -> seat prompts : fanned attach point, 24px from its sibling -->
      <path class="flow" d="M464,264 H508 Q516,264 516,256 V160 Q516,152 524,152 H564" marker-end="url(#arrow)"/>
      <!-- config -> rule engine -->
      <path class="flow" d="M464,288 H508 Q516,288 516,296 V392 Q516,400 524,400 H564" marker-end="url(#arrow)"/>
      <!-- seat prompts -> agent runtime -->
      <line class="flow" x1="736" y1="152" x2="836" y2="152" marker-end="url(#arrow)"/>
      <!-- agent runtime -> mission artifacts : straight vertical into the top port -->
      <line class="flow" x1="940" y1="176" x2="940" y2="452" marker-end="url(#arrow)"/>
      <!-- rule engine -> CLI : the CLI is the rules with an I/O shell around them -->
      <line class="flow" x1="652" y1="424" x2="652" y2="452" marker-end="url(#arrow)"/>
      <!-- mission artifacts -> CLI : arrows follow the DATA, so a read points at
           the reader. Pointing this at the artifacts would read as a write. -->
      <line class="flow" x1="840" y1="480" x2="740" y2="480" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect class="mask" x="228" y="256" width="40" height="12" rx="2"/>
      <text class="arrow-label" x="248" y="266">ADAPT</text>

      <rect class="mask" x="758" y="132" width="56" height="12" rx="2"/>
      <text class="arrow-label" x="786" y="142">LOADED BY</text>

      <rect class="mask" x="952" y="308" width="88" height="12" rx="2"/>
      <text class="arrow-label" x="996" y="318">WRITES ARTIFACTS</text>

      <rect class="mask" x="766" y="460" width="40" height="12" rx="2"/>
      <text class="arrow-label" x="786" y="470">READS</text>

      <!-- Nodes -->
      <rect class="node input" x="64" y="248" width="144" height="56" rx="6"/>
      <text class="node-name" x="136" y="272">Your repo</text>
      <text class="sublabel" x="136" y="288">any stack</text>

      <rect class="node focal" x="288" y="248" width="176" height="56" rx="6"/>
      <text class="node-name focal-name" x="376" y="272">One config file</text>
      <text class="sublabel" x="376" y="288">the only project knowledge</text>

      <rect class="node" x="568" y="128" width="168" height="48" rx="6"/>
      <text class="node-name" x="652" y="150">Seat prompts</text>
      <text class="sublabel" x="652" y="164">plain markdown</text>

      <rect class="node" x="568" y="376" width="168" height="48" rx="6"/>
      <text class="node-name" x="652" y="398">Rule engine</text>
      <text class="sublabel" x="652" y="412">pure · 94 tests</text>

      <rect class="node" x="568" y="456" width="168" height="48" rx="6"/>
      <text class="node-name" x="652" y="478">mission CLI</text>
      <text class="sublabel" x="652" y="492">never calls a model</text>

      <rect class="node external" x="840" y="128" width="200" height="48" rx="6"/>
      <text class="node-name" x="940" y="150">Any agent runtime</text>
      <text class="sublabel" x="940" y="164">Claude Code · Codex · Cursor</text>

      <rect class="node store" x="840" y="456" width="200" height="48" rx="6"/>
      <text class="node-name" x="940" y="478">Mission artifacts</text>
      <text class="sublabel" x="940" y="492">contract · handoffs · verdicts</text>

      <!-- Legend -->
      <line x1="64" y1="552" x2="1056" y2="552" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text class="legend-eyebrow" x="64" y="568">LEGEND</text>

      <rect class="node focal" x="64" y="584" width="14" height="10" rx="2"/>
      <text class="legend-text" x="84" y="593">Single injection point</text>

      <rect class="node" x="232" y="584" width="14" height="10" rx="2"/>
      <text class="legend-text" x="252" y="593">Harness component</text>

      <rect class="node store" x="396" y="584" width="14" height="10" rx="2"/>
      <text class="legend-text" x="416" y="593">Durable state</text>

      <rect class="node external" x="536" y="584" width="14" height="10" rx="2"/>
      <text class="legend-text" x="556" y="593">Swappable / external</text>

      <rect class="node input" x="700" y="584" width="14" height="10" rx="2"/>
      <text class="legend-text" x="720" y="593">Your input</text>
    </svg>
  </main>
</body>
</html>
